<div id="kc-root">
<style>

#kc-root .kc-pill{background:rgba(255,255,255,.22);border-radius:12px;padding:3px 12px;font-size:12px}
#kc-root .kc-intro{background:#C9D6E8;border:1px solid #aebbd0;border-top:0;padding:12px 16px;border-radius:0 0 4px 4px;margin-bottom:16px}
#kc-root .kc-card{border:1px solid #c5ccd6;border-radius:4px;margin-bottom:18px;background:#fff}
#kc-root .kc-body{padding:16px}
#kc-root .kc-scn{background:#f4f6f9;border:1px solid #d5dae2;border-radius:4px;padding:12px 14px;margin-bottom:16px}
#kc-root .kc-scn b{display:block;color:#1F4E9E;font-size:11px;letter-spacing:.5px;margin-bottom:4px}
#kc-root .kc-q{font-weight:bold;font-size:15px;margin:0 0 10px}
#kc-root .kc-opt{display:flex;gap:10px;align-items:flex-start;border:1px solid #c5ccd6;border-radius:4px;background:#f4f6f9;padding:10px 12px;margin-bottom:8px;cursor:pointer}
#kc-root .kc-opt:hover{border-color:#1F4E9E}
#kc-root .kc-opt.sel{border-color:#1F4E9E;background:#e3ebf8}
#kc-root .kc-opt.right{border-color:#1b7a3a;background:#e4f4e9}
#kc-root .kc-opt.wrong{border-color:#b3261e;background:#fbe9e7}
#kc-root .kc-opt.locked{cursor:default}
#kc-root .kc-let{flex:0 0 24px;height:24px;border-radius:50%;background:#d5dae2;text-align:center;line-height:24px;font-weight:bold;font-size:12px}
#kc-root .kc-name{display:inline-block;font-family:"Courier New",monospace;font-size:12px;font-weight:bold;background:#e1e9f7;border:1px solid #b9c8e3;color:#1F4E9E;padding:1px 6px;border-radius:3px;margin-bottom:3px}
#kc-root .kc-desc{font-size:12px;color:#4a5563}
#kc-root .kc-foot{background:#f0f1f3;border-top:1px solid #d5dae2;padding:10px 16px}
#kc-root button{background:#1F4E9E;color:#fff;border:0;border-radius:3px;padding:9px 20px;font-weight:bold;font-size:13px;cursor:pointer}
#kc-root button:disabled{background:#9aa7bd;cursor:not-allowed}
#kc-root .kc-fb{margin-top:12px;padding:10px 12px;border-radius:4px;display:none}
#kc-root .kc-fb.ok{display:block;background:#e4f4e9;border:1px solid #1b7a3a}
#kc-root .kc-fb.no{display:block;background:#fbe9e7;border:1px solid #b3261e}
#kc-root .kc-res{display:none;background:#e3ebf8;border:1px solid #1F4E9E;border-radius:4px;padding:16px;text-align:center}
#kc-root .kc-res h3{margin:0 0 6px;color:#1F4E9E}
</style>
<div class="kc-head"><span>Activity Codes — Knowledge Check</span><span class="kc-pill" id="kc-prog">0 of 8 answered</span></div>
<div class="kc-intro">Read each scenario and select the SLS Paralegal activity code that best matches the work described. Use what you learned from the reference table to guide your answers. Select codes by name.</div>
<div id="kc-list"></div>
<div class="kc-res" id="kc-res"></div>
<script>
(function(){
var D=[{"n":1,"tag":"Case Work","prompt":"Which activity code should you select?","scenario":"A client's completed questionnaire (CQ) has just come in through DocuFree. You review the responses, validate the client's information, set the SOL date based on the CQ, and update the client's Litify matter with the information from the CQ.","opts":[{"name":"SOL Review","desc":"Review of SOLs as part of a case audit, separate from CQ review. Used when SOLs need to be revisited based on litigation attorney guidance, or to verify upcoming SOLs."},{"name":"CQ Retrieval","desc":"Outreach to clients related to CQ or HIPAA retrieval, including outreach to obtain missing or updated information or other documents."},{"name":"CQ Review","desc":"Review of submitted questionnaire; validation of client info; setting SOLs based on CQ. Includes updating Litify matters with information from the CQ, whether received electronically or via DocuFree."},{"name":"Misc. Document Review","desc":"Review of miscellaneous client documents to confirm retrieval of required information."}],"ans":2,"ok":"Correct. CQ Review covers reviewing the submitted questionnaire, validating client information, setting SOLs based on the CQ, and updating Litify with the CQ information. SOL Review is not used when SOL work happens at the same time as CQ review.","no":"Not quite. Setting the SOL from the questionnaire and updating Litify with the CQ information is part of CQ Review. SOL Review is only for SOL work done separately from CQ review. Review the Current B4T Activity Code Reference and try again."},{"n":2,"tag":"Medical","prompt":"Which activity code should you select?","scenario":"A client's medical records have arrived. You spend 90 minutes reviewing them, updating the Medical History tab in Litify, and drafting a medical record summary to document the client's injuries and exposure.","opts":[{"name":"Medical Record Request/Follow Up","desc":"Submission of MR record requests via Litify. Creation of roles and other information in Litify required to submit requests. Includes client outreach and other activities to gather additional information required to request medical records."},{"name":"Medical Record Review","desc":"Review of medical records to establish POU/POI. Includes time spent updating the Medical History tab in Litify, creating medical record summaries, and reviewing other documents required to validate and prove usage, exposure, and injury."},{"name":"Medical Bill Review","desc":"Review of medical bills and adding damages to Litify. Analysis and synthesis of damages across injuries."},{"name":"Case Value/Enhancement Research","desc":"Review of inventory for top cases, plus review and evaluation of matters to gather information or evidence that could strengthen or increase a client's claim value."}],"ans":1,"ok":"Correct. Reviewing medical records, updating the Medical History tab, and creating medical record summaries is Medical Record Review. (Remember: if you review records at the same time as drafting a complaint or curing a PFS, log the time under Complaint Prep/Draft or PFS Decifiencies instead.)","no":"Not quite. Reviewing medical records, updating the Medical History tab in Litify, and writing a medical record summary is Medical Record Review. Review the Current B4T Activity Code Reference and try again."},{"n":3,"tag":"Comms","prompt":"Which activity code should you select?","scenario":"A client calls you unexpectedly to ask about the status of their case. You did not reach out to them, and the call is not tied to any specific work-up task you are handling. You spend 20 minutes on the phone answering their questions.","opts":[{"name":"Client Communication","desc":"Response to inbound client communication that is NOT related to a specific work-up activity. Includes time on the phone with a client as well as reviewing and responding to client emails."},{"name":"Admin Team Meetings & Training","desc":"All meetings and trainings, including check-ins with Team Leads/Case Ops Managers, weekly calls with the attorney/lead paralegal, and internal M&M meetings not tied to your assigned tort."},{"name":"CQ Retrieval","desc":"Outreach to clients related to CQ or HIPAA retrieval."},{"name":"Admin Check Emails & DocuFree","desc":"Reviewing inbox; checking/processing DocuFree."}],"ans":0,"ok":"Correct. An unprompted inbound call that is not related to a specific work-up activity is Client Communication. If the communication is part of a specific task (for example, calling a client to complete a PFS), log it under that task's code instead.","no":"Not quite. The client initiated the call and it is not related to a specific work-up activity, so it is Client Communication. Review the Current B4T Activity Code Reference and try again."},{"n":4,"tag":"Admin","prompt":"How should you log this time?","scenario":"You notice that three client Display Names in Litify are formatted incorrectly. You spend 30 minutes correcting the names, updating their Questionnaire Status, and fixing a File # field that was entered incorrectly.","opts":[{"name":"Admin Organizing/Prioritizing Tasks","desc":"Select this code. It covers planning your day, entering time in Bill4Time, prioritizing tasks, and preparing to-do lists."},{"name":"Other","desc":"Select the generic “Other” activity code and describe the work in the entry description."},{"name":"Confirm the code with your COM","desc":"The Data Clean Up code is no longer available and no current code is a clear match. Confirm the correct code with your COM before entering time."},{"name":"Misc. Document Review","desc":"Select this code. It covers review of miscellaneous client documents to confirm retrieval of required information."}],"ans":2,"ok":"Correct. The Data Clean Up code was removed on 10/13/2026 and no replacement has been identified. Never bill to the generic “Other” code; if nothing on the list fits, confirm the correct code with your COM before entering time.","no":"Not quite. Data Clean Up was removed on 10/13/2026 and has no replacement code. Never bill to “Other,” and do not guess. Confirm the correct code with your COM before entering time."},{"n":5,"tag":"Docs & Filings","prompt":"Which activity code should you select?","scenario":"A client's previously submitted PFS was returned with deficiencies. You spend two hours curing it: you re-review the client's medical records, call the client to get a missing piece of information, and draft an updated PFS.","opts":[{"name":"PFS Prep/Draft","desc":"Preparation of PFS documents, including filling in forms and reaching out to clients and/or running locates to gather required information."},{"name":"Medical Record Review","desc":"Review of medical records to establish POU/POI. Not used for medical record review done concurrently with drafting a complaint or curing a PFS."},{"name":"Client Communication","desc":"Response to inbound client communication that is NOT related to a specific work-up activity."},{"name":"PFS Decifiencies","desc":"All work-up related to curing PFS deficiencies. Includes outreach to clients to gather more information, re-review of medical records, drafting an updated PFS, and any other actions required to cure a deficient PFS."}],"ans":3,"ok":"Correct. All work done to cure a deficient PFS, including client outreach, re-reviewing medical records, and drafting the updated PFS, is logged under one code: PFS Decifiencies. Enter the name exactly as it appears in the live system, misspelling included.","no":"Not quite. When the work is curing a PFS deficiency, the client call and the medical record re-review are part of that task and are logged under PFS Decifiencies (spelled exactly that way in the live system), not under Client Communication or Medical Record Review."},{"n":6,"tag":"Settlement","prompt":"Which activity code should you select?","scenario":"A client's case has settled and the funds are ready to be disbursed. You prepare the distribution statement, execute the closing statement, submit the release to the administrator, and speak with the client about their settlement payment amount.","opts":[{"name":"Pre-Disbursement and Settlement Prep","desc":"All work-up related to preparation and submission of a client's settlement package, including auditing the file, verifying fee structure, submitting settlement forms to the portal, and managing settlement elections and releases."},{"name":"Disbursement and Fee Banking","desc":"Activities related to executing closing statements and disbursing funds to the client. May include preparing the distribution statement, executing the closing statement, submitting the release to the administrator, and managing bankruptcy holds and clearances."},{"name":"Post-Disbursement and File Closure","desc":"Activities related to closing files after fund disbursement, including preparing appeals and deficiency responses, auditing impediments and holds, and attending settlement status meetings."},{"name":"Admin: Finance","desc":"Internal activity related to Finance queries, billing statements, expense allocations, and attorney reimbursements."}],"ans":1,"ok":"Correct. Preparing the distribution statement, executing the closing statement, and submitting the release are Disbursement and Fee Banking. Client communication about the payment is logged under this code too, because it is part of the specific work-up activity.","no":"Not quite. The work described happens at the disbursement stage: preparing the distribution statement, executing the closing statement, and submitting the release. That is Disbursement and Fee Banking. Admin: Finance is not used for closing statements or related client communication."},{"n":7,"tag":"Admin","prompt":"Which activity code should you select?","scenario":"Your computer is running slowly and you cannot access Litify. You contact M&M IT and spend 45 minutes on the phone troubleshooting your remote desktop connection and log-in access.","opts":[{"name":"Admin Tech Issues","desc":"Time spent working with M&M IT to resolve tech issues (e.g., remote desktop, log-in access, Litify bugs)."},{"name":"Admin Organizing/Prioritizing Tasks","desc":"Planning your day, entering time in Bill4Time, prioritizing tasks, preparing to-do lists, etc."},{"name":"Admin Check Emails & DocuFree","desc":"Reviewing inbox; checking/processing DocuFree."},{"name":"Admin Team Meetings & Training","desc":"All meetings and trainings, including internal M&M meetings not tied to your assigned tort."}],"ans":0,"ok":"Correct. Time spent working with M&M IT to resolve remote desktop, log-in, or Litify issues is Admin Tech Issues.","no":"Not quite. Troubleshooting with M&M IT is Admin Tech Issues. Review the Current B4T Activity Code Reference and try again."},{"n":8,"tag":"Settlement","prompt":"Which activity code should you select?","scenario":"You are preparing a client's matter for a settlement package. You audit the file for completeness, confirm the proof of use and proof of injury documents are in place and updated in Litify, update the Settlement tab, and verify the fee structure.","opts":[{"name":"Case Value/Enhancement Research","desc":"Review of inventory for top cases, plus review and evaluation of matters to gather information or evidence that could strengthen or increase a client's claim value."},{"name":"Medical Record Review","desc":"Review of medical records to establish POU/POI, update the Medical History tab, and create medical record summaries."},{"name":"Misc. Document Review","desc":"Review of miscellaneous client documents to confirm retrieval of required information."},{"name":"Pre-Disbursement and Settlement Prep","desc":"All work-up related to preparation and submission of a client's settlement package. May include auditing the file for comprehensiveness, updating Litify fields (e.g., POI/POU, Morgan Health, Settlement tab), and verifying fee structure."}],"ans":3,"ok":"Correct. Auditing the file for comprehensiveness, updating Litify fields such as the Settlement tab, and verifying the fee structure are all part of Pre-Disbursement and Settlement Prep. The former Case Audit code was removed on 10/13/2026.","no":"Not quite. Auditing a file to get it ready for a settlement package, updating the Settlement tab, and verifying the fee structure is Pre-Disbursement and Settlement Prep. Review the Current B4T Activity Code Reference and try again."}];
var L='ABCD',answered=0,score=0,list=document.getElementById('kc-list');
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
D.forEach(function(q,qi){
  var c=document.createElement('div');c.className='kc-card';
  var h='<div class="kc-head"><span>Question '+q.n+' of 8</span><span class="kc-pill">'+esc(q.tag)+'</span></div><div class="kc-body"><div class="kc-scn"><b>SCENARIO</b>'+esc(q.scenario)+'</div><p class="kc-q">'+esc(q.prompt)+'</p>';
  q.opts.forEach(function(o,i){h+='<div class="kc-opt" data-i="'+i+'" role="radio" aria-checked="false" tabindex="0"><span class="kc-let">'+L[i]+'</span><span><span class="kc-name">'+esc(o.name)+'</span><br><span class="kc-desc">'+esc(o.desc)+'</span></span></div>';});
  h+='<div class="kc-fb"></div></div><div class="kc-foot"><button disabled>Submit Answer</button></div>';
  c.innerHTML=h;list.appendChild(c);
  var opts=c.querySelectorAll('.kc-opt'),btn=c.querySelector('button'),fb=c.querySelector('.kc-fb'),pick=-1,done=false;
  function choose(i){if(done)return;pick=i;opts.forEach(function(o,j){o.classList.toggle('sel',j===i);o.setAttribute('aria-checked',j===i);});btn.disabled=false;}
  opts.forEach(function(o,i){o.addEventListener('click',function(){choose(i);});o.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(i);}});});
  btn.addEventListener('click',function(){
    if(done||pick<0)return;done=true;btn.disabled=true;
    var ok=pick===q.ans;if(ok)score++;
    opts.forEach(function(o,j){o.classList.add('locked');o.classList.remove('sel');if(j===q.ans)o.classList.add('right');else if(j===pick)o.classList.add('wrong');});
    fb.className='kc-fb '+(ok?'ok':'no');fb.textContent=ok?q.ok:q.no+' Correct answer: '+L[q.ans]+' \u2014 '+q.opts[q.ans].name+'.';
    answered++;document.getElementById('kc-prog').textContent=answered+' of 8 answered';
    if(answered===D.length){var r=document.getElementById('kc-res');r.style.display='block';r.innerHTML='<h3>Knowledge Check Complete</h3>You answered '+score+' of '+D.length+' correctly.';}
  });
});
})();
</script>
</div>
